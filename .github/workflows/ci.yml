name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Build package
        run: task build

  lint-typecheck:
    name: Lint And Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: task lint:check

      - name: Typecheck
        run: task typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Test
        run: task test
